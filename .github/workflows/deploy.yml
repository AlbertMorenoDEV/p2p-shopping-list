name: Deploy Shared Shopping List

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write # Required for AWS OIDC
  contents: write # Required for GitHub Pages deploy

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'eu-central-1' }}
  DOMAIN_NAME: ${{ secrets.DOMAIN_NAME || 'list.albertmoreno.dev' }}

jobs:
  check:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build App
        env:
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
          VITE_WS_ROOM_PREFIX: ${{ vars.VITE_WS_ROOM_PREFIX }}
        run: npm run build

      - name: Add CNAME for Custom Domain
        run: echo "${{ env.DOMAIN_NAME }}" > ./dist/CNAME

      - name: Upload Build Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  terraform:
    name: Infrastructure (Terraform)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        contains(toJSON(github.event.commits.*.modified), 'terraform/') ||
        contains(toJSON(github.event.commits.*.added), 'terraform/') ||
        contains(toJSON(github.event.commits.*.removed), 'terraform/')
      ))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="hosted_zone_id=${{ secrets.HOSTED_ZONE_ID }}" \
            -var="domain_name=${{ env.DOMAIN_NAME }}" \
            -var="aws_region=${{ env.AWS_REGION }}"
        working-directory: terraform

  deploy:
    name: Publish (GitHub Pages)
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
